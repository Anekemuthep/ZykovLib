<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zigrafi - Prototipo de dataNotebook (parser + libretas + File System)</title>
  <style>
    body { font-family: sans-serif; display: flex; gap: 20px; margin: 20px; }
    textarea, input, select { width: 100%; margin-top: 5px; font-size: 14px; }
    .column { flex: 1; min-width: 320px; }
    .section { margin-bottom: 20px; }
    .toolbar { display:flex; gap:10px; margin-bottom: 10px; flex-wrap: wrap; }
    .toolbar button { padding: 6px 10px; }
    /* Modal genérico */
    .modal-backdrop {
      display:none; position:fixed; inset:0;
      background: rgba(0,0,0,0.35);
      align-items:center; justify-content:center;
      z-index: 9999;
    }
    .modal {
      background:#fff; padding:16px; border-radius:8px; min-width:360px;
      max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal h4 { margin: 0 0 10px 0; }
    .modal .row { display:flex; gap:8px; margin-top:10px; }
    .modal .row button { flex:1; padding:8px; }
    .hint { font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div class="column">
    <div class="toolbar">
      <!-- Carpeta virtual en localStorage -->
      <button onclick="createNewNotebook()">Crear nueva libreta</button>
      <button onclick="openLoadModal()">Buscar libretas</button>
      <button onclick="downloadNotebook()">Exportar JSON</button>

      <!-- File System Access API -->
      <button onclick="pickDatanotebooksDir()">Elegir carpeta (File System)</button>
      <button onclick="saveToFS()">Guardar en carpeta</button>
      <button onclick="openFsLoadModal()">Cargar desde carpeta</button>
      <span id="fsStatus" class="hint"></span>
    </div>

    <div class="section">
      <h3>Expresión del grafo</h3>
      <textarea id="expr" rows="3"></textarea>
      <button onclick="renderGraph()">Renderizar grafo</button>
    </div>

    <div class="section">
      <h3>Editor de nodo</h3>
      <select id="node-selector" onchange="selectNode(this.value)"></select>
      <input id="node-title" placeholder="Título del nodo">
      <textarea id="node-text" placeholder="Texto del nodo"></textarea>
      <button onclick="saveNodeInfo()">Guardar nodo</button>
    </div>

    <div class="section">
      <h3>Editor de tópico</h3>
      <select id="topic-selector" onchange="selectTopic(this.value)"></select>
      <input id="topic-title" placeholder="Título del tópico">
      <textarea id="topic-desc" placeholder="Descripción del tópico"></textarea>
      <button onclick="saveTopicInfo()">Guardar tópico</button>
    </div>

    <div class="section">
      <h3>Editor general</h3>
      <input id="all-title" placeholder="Título general">
      <textarea id="all-desc" placeholder="Descripción general"></textarea>
      <button onclick="saveAllInfo()">Guardar all</button>
    </div>
  </div>

  <!-- Modal cargar/borrar desde “carpeta virtual” -->
  <div id="loadModal" class="modal-backdrop">
    <div class="modal">
      <h4>Libretas guardadas (memoria local)</h4>
      <select id="loadSelect" size="6" style="width:100%"></select>
      <div class="row">
        <button onclick="loadSelected()">Cargar</button>
        <button onclick="deleteSelected()" style="background:#f8d7da">Borrar</button>
        <button onclick="closeLoadModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal cargar desde carpeta real (FS API) -->
  <div id="fsLoadModal" class="modal-backdrop">
    <div class="modal">
      <h4>Archivos en carpeta datanotebooks</h4>
      <select id="fsFileSelect" size="8" style="width:100%"></select>
      <div class="row">
        <button onclick="loadFromFS()">Cargar archivo</button>
        <button onclick="closeFsLoadModal()">Cancelar</button>
      </div>
      <div class="hint" style="margin-top:8px;">
        Si no ves tu carpeta, pulsa “Elegir carpeta (File System)” y selecciona:
        <br>/Users/alfonsobustamante/ZykovLib/topic/datanotebooks
      </div>
    </div>
  </div>

  <script>
    // -------- Parser robusto ----------
    function extractNodesAndTopics(expression) {
      const nodes = new Set();
      const topics = new Set();
      let cleaned = expression || "";

      cleaned = cleaned.replace(
        /\b([A-Za-z0-9_]+)\s*::::\s*([A-Za-z0-9_]+)\s*\*\s*\(([^)]*)\)/g,
        (_m, leftNode, topic, group) => {
          const n = (leftNode || '').trim();
          const t = (topic || '').trim();
          if (t) topics.add(t);
          if (n && n !== t) nodes.add(n);
          group.split(/[+*]/).forEach(tok => {
            const v = (tok || '').trim();
            if (v && v !== t) nodes.add(v);
          });
          return `${n} * (${group})`;
        }
      );
      cleaned = cleaned.replace(
        /\b([A-Za-z0-9_]+)\s*::::\s*([A-Za-z0-9_]+)\s*\*\s*([A-Za-z0-9_]+)/g,
        (_m, leftNode, topic, single) => {
          const n = (leftNode || '').trim();
          const t = (topic || '').trim();
          const s = (single || '').trim();
          if (t) topics.add(t);
          if (n && n !== t) nodes.add(n);
          if (s && s !== t) nodes.add(s);
          return `${n} * ${s}`;
        }
      );
      cleaned = cleaned.replace(
        /\b([A-Za-z0-9_]+)\s*::::\s*([A-Za-z0-9_]+)/g,
        (_m, leftNode, topic) => {
          const n = (leftNode || '').trim();
          const t = (topic || '').trim();
          if (t) topics.add(t);
          if (n && n !== t) nodes.add(n);
          return `${n}`;
        }
      );
      cleaned.split(/[^A-Za-z0-9_]+/).forEach(tok => {
        const v = (tok || '').trim();
        if (v && !topics.has(v)) nodes.add(v);
      });

      return {
        nodes: [...nodes].filter(n => n && !topics.has(n)).sort(),
        topics: [...topics].sort()
      };
    }

    // --------------------- Estado ---------------------
    let notebooksData = {
      notebookDataPresentation: {
        name: "Samy",
        expression:
          "LoQuePuedesHacer :::: acciones * (crearGrafo + cargarGrafo) + tuPrimerGrafo :::: empezando * crearGrafo",
        nodes: {
          "crearGrafo":    { "title": "Crear un nuevo grafo", "text": "Haz clic en 'nueva libreta' para empezar." },
          "cargarGrafo":   { "title": "Cargar un grafo existente", "text": "Puedes importar un archivo JSON con tu libreta." },
          "tuPrimerGrafo": { "title": "Bienvenido", "text": "Este es tu primer grafo. Puedes modificarlo como quieras." }
        },
        topics: {
          "acciones":  { "title": "Acciones posibles", "description": "Puedes crear o cargar grafos desde aquí." },
          "empezando": { "title": "Primeros pasos", "description": "Inicia editando nodos o escribiendo expresiones." }
        },
        all: { "title": "Zigrafi, tu bloc de notas semántico", "description": "Empieza creando un grafo o cargando uno." }
      },
      notebookDataSandbox: {}
    };

    // ------------------ Carpeta virtual (localStorage) ------------------
    const STORAGE_PREFIX = 'datanotebook:';
    const INDEX_KEY = 'datanotebooksIndex';

    function getIndex() {
      try { return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]'); }
      catch { return []; }
    }
    function setIndex(arr) { localStorage.setItem(INDEX_KEY, JSON.stringify([...new Set(arr)])); }
    function saveNotebookToStorage(name, data) {
      localStorage.setItem(STORAGE_PREFIX + name, JSON.stringify(data));
      const idx = getIndex();
      if (!idx.includes(name)) { idx.push(name); setIndex(idx); }
    }
    function loadNotebookFromStorage(name) {
      const raw = localStorage.getItem(STORAGE_PREFIX + name);
      return raw ? JSON.parse(raw) : null;
    }
    function deleteNotebookFromStorage(name) {
      localStorage.removeItem(STORAGE_PREFIX + name);
      const idx = getIndex().filter(n => n !== name);
      setIndex(idx);
    }
    function listNotebooks() { return getIndex().sort((a,b)=>a.localeCompare(b,'es',{numeric:true})); }
    function getNextUntitledName(base = 'untitled') {
      const existing = listNotebooks().filter(n => n === base || n.startsWith(base + ' '));
      if (!existing.length) return base;
      let max = 1;
      existing.forEach(n => {
        const m = n.match(/^untitled(?:\s+(\d+))?$/i);
        if (m) { const num = m[1] ? parseInt(m[1], 10) : 1; if (num > max) max = num; }
      });
      return `${base} ${max + 1}`;
    }

    // ------------------ Helpers de UI ------------------
    function setSelectOptions(selectEl, items) {
      selectEl.innerHTML = items.map(k => `<option value="${k}">${k}</option>`).join('');
      if (items.length) selectEl.value = items[0];
    }
    function updateUI() {
      const s = notebooksData.notebookDataSandbox;
      document.getElementById("expr").value = s.expression || "";
      document.getElementById("all-title").value = s.all?.title || "";
      document.getElementById("all-desc").value  = s.all?.description || "";
      const nodeKeys  = Object.keys(s.nodes || {}).sort();
      const topicKeys = Object.keys(s.topics || {}).sort();
      setSelectOptions(document.getElementById("node-selector"), nodeKeys);
      setSelectOptions(document.getElementById("topic-selector"), topicKeys);
      if (nodeKeys.length) selectNode(nodeKeys[0]); else { document.getElementById("node-title").value=""; document.getElementById("node-text").value=""; }
      if (topicKeys.length) selectTopic(topicKeys[0]); else { document.getElementById("topic-title").value=""; document.getElementById("topic-desc").value=""; }
    }

    // ----------------- Inicialización ------------------
    function initSandbox() {
      notebooksData.notebookDataSandbox = JSON.parse(JSON.stringify(notebooksData.notebookDataPresentation));
      const s = notebooksData.notebookDataSandbox;
      s.nodes  = s.nodes  || {};
      s.topics = s.topics || {};
      s.all    = s.all    || { title: "", description: "" };
      const expr = s.expression || "";
      const { nodes, topics } = extractNodesAndTopics(expr);
      nodes.forEach(n => { if (!s.nodes[n])  s.nodes[n]  = { title: "add title", text: "" }; });
      topics.forEach(t => { if (!s.topics[t]) s.topics[t] = { title: "add title", description: "" }; });
      updateUI();
      reflectFsStatus();
    }

    // ----------------- Renderizar/parsear -----------------
    function renderGraph() {
      const s = notebooksData.notebookDataSandbox;
      const expr = (document.getElementById("expr").value || "").trim();
      s.expression = expr;
      const { nodes, topics } = extractNodesAndTopics(expr);
      const newNodes = {}; nodes.forEach(n => { newNodes[n] = s.nodes?.[n] || { title: "add title", text: "" }; });
      const newTopics = {}; topics.forEach(t => { newTopics[t] = s.topics?.[t] || { title: "add title", description: "" }; });
      s.nodes = newNodes; s.topics = newTopics;
      updateUI();
    }

    // ----------------- Selectores y guardado -----------------
    function selectNode(n) {
      const d = notebooksData.notebookDataSandbox.nodes?.[n] || {};
      document.getElementById("node-title").value = d.title || "";
      document.getElementById("node-text").value  = d.text  || "";
    }
    function selectTopic(t) {
      const d = notebooksData.notebookDataSandbox.topics?.[t] || {};
      document.getElementById("topic-title").value = d.title || "";
      document.getElementById("topic-desc").value  = d.description || "";
    }
    function saveNodeInfo() {
      const n = document.getElementById("node-selector").value;
      if (!n) return;
      notebooksData.notebookDataSandbox.nodes[n] = {
        title: document.getElementById("node-title").value,
        text:  document.getElementById("node-text").value
      };
    }
    function saveTopicInfo() {
      const t = document.getElementById("topic-selector").value;
      if (!t) return;
      notebooksData.notebookDataSandbox.topics[t] = {
        title:       document.getElementById("topic-title").value,
        description: document.getElementById("topic-desc").value
      };
    }
    function saveAllInfo() {
      notebooksData.notebookDataSandbox.all = {
        title:       document.getElementById("all-title").value,
        description: document.getElementById("all-desc").value
      };
    }

    // ----------------- Exportar (descargar) -----------------
    function downloadNotebook() {
      const s = notebooksData.notebookDataSandbox;
      const blob = new Blob([JSON.stringify(s, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${s.name || "notebook"}.json`;
      a.click();
    }

    // ----------------- Crear nueva libreta (virtual) -----------------
    function createNewNotebook() {
      const suggested = getNextUntitledName('untitled');
      let name = prompt('Nombre de la nueva libreta:', suggested);
      if (name === null) return;
      name = name.trim();
      if (!name) { alert('Nombre vacío.'); return; }
      const s = JSON.parse(JSON.stringify(notebooksData.notebookDataSandbox));
      s.name = name;
      saveNotebookToStorage(name, s);
      notebooksData.notebookDataSandbox = s;
      updateUI();
      alert(`Libreta "${name}" creada (memoria local).`);
    }

    // ----------------- Cargar / Borrar libretas (virtual) -----------------
    function openLoadModal() {
      const list = listNotebooks();
      const sel = document.getElementById('loadSelect');
      sel.innerHTML = list.map(n => `<option value="${n}">${n}</option>`).join('') || `<option disabled>(sin libretas)</option>`;
      document.getElementById('loadModal').style.display = 'flex';
    }
    function closeLoadModal() { document.getElementById('loadModal').style.display = 'none'; }
    function loadSelected() {
      const sel = document.getElementById('loadSelect');
      const name = sel.value;
      if (!name) return;
      const data = loadNotebookFromStorage(name);
      if (!data) { alert('No se pudo cargar la libreta.'); return; }
      notebooksData.notebookDataSandbox = data;
      updateUI();
      closeLoadModal();
    }
    function deleteSelected() {
      const sel = document.getElementById('loadSelect');
      const name = sel.value;
      if (!name) return;
      if (!confirm(`¿Borrar la libreta "${name}"?`)) return;
      deleteNotebookFromStorage(name);
      openLoadModal();
    }

    // =================== File System Access API ===================
    // Guardamos el handle de la carpeta en IndexedDB para persistir permisos
    const FS_DB_NAME = 'zygrafi-fs';
    const FS_STORE = 'handles';
    const FS_KEY = 'datanotebooksDir';

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(FS_DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(FS_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSet(key, val) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FS_STORE, 'readwrite');
        tx.objectStore(FS_STORE).put(val, key);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FS_STORE, 'readonly');
        const req = tx.objectStore(FS_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbDel(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(FS_STORE, 'readwrite');
        tx.objectStore(FS_STORE).delete(key);
        tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
      });
    }

    async function verifyPermission(handle, writable) {
      const opts = { mode: writable ? 'readwrite' : 'read' };
      if ((await handle.queryPermission(opts)) === 'granted') return true;
      if ((await handle.requestPermission(opts)) === 'granted') return true;
      return false;
    }

    async function getSavedDirHandle() {
      try {
        const handle = await idbGet(FS_KEY);
        return handle || null;
      } catch { return null; }
    }

    async function pickDatanotebooksDir() {
      if (!('showDirectoryPicker' in window)) {
        alert('Tu navegador no soporta File System Access API. Usa Chrome/Edge en HTTPS o localhost.');
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker();
        const ok = await verifyPermission(dirHandle, true);
        if (!ok) { alert('Permiso denegado.'); return; }
        await idbSet(FS_KEY, dirHandle);
        reflectFsStatus('Carpeta vinculada.');
      } catch (e) {
        console.warn(e);
      }
    }

    async function reflectFsStatus(msg) {
      const span = document.getElementById('fsStatus');
      const handle = await getSavedDirHandle();
      if (!handle) { span.textContent = '(sin carpeta FS)'; return; }
      span.textContent = msg || '(carpeta FS lista)';
    }

    async function listFsJsonFiles() {
      const dirHandle = await getSavedDirHandle();
      if (!dirHandle) return [];
      const ok = await verifyPermission(dirHandle, false);
      if (!ok) return [];
      const files = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && name.toLowerCase().endsWith('.json')) {
          files.push({ name, handle });
        }
      }
      files.sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true}));
      return files;
    }

    async function saveToFS() {
      const dirHandle = await getSavedDirHandle();
      if (!dirHandle) { alert('Primero elige la carpeta (File System).'); return; }
      const ok = await verifyPermission(dirHandle, true);
      if (!ok) { alert('Sin permiso de escritura en la carpeta.'); return; }

      const s = notebooksData.notebookDataSandbox;
      let filename = prompt('Nombre de archivo (sin extensión):', (s.name || 'notebook'));
      if (filename === null) return;
      filename = filename.trim();
      if (!filename) { alert('Nombre vacío.'); return; }

      const fileHandle = await dirHandle.getFileHandle(filename + '.json', { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' }));
      await writable.close();
      alert(`Guardado en carpeta: ${filename}.json`);
    }

    function openFsLoadModal() {
      fillFsList().then(() => {
        document.getElementById('fsLoadModal').style.display = 'flex';
      });
    }
    function closeFsLoadModal() {
      document.getElementById('fsLoadModal').style.display = 'none';
    }

    async function fillFsList() {
      const sel = document.getElementById('fsFileSelect');
      sel.innerHTML = '<option>(cargando...)</option>';
      const files = await listFsJsonFiles();
      if (!files.length) {
        sel.innerHTML = '<option disabled>(no hay .json)</option>';
        return;
      }
      sel.innerHTML = files.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
    }

    async function loadFromFS() {
      const dirHandle = await getSavedDirHandle();
      if (!dirHandle) { alert('Primero elige la carpeta (File System).'); return; }
      const ok = await verifyPermission(dirHandle, false);
      if (!ok) { alert('Sin permiso de lectura.'); return; }
      const sel = document.getElementById('fsFileSelect');
      const name = sel.value;
      if (!name) return;
      const fileHandle = await dirHandle.getFileHandle(name);
      const file = await fileHandle.getFile();
      const text = await file.text();
      try {
        const json = JSON.parse(text);
        notebooksData.notebookDataSandbox = json;
        updateUI();
        closeFsLoadModal();
      } catch (e) {
        alert('JSON inválido.');
      }
    }

    // Go!
    initSandbox();
  </script>
</body>
</html>
